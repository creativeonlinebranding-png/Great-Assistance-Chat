<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Great Assistance Chat</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111b21;
    font-family:Arial,sans-serif;
    color:white;
}

.box{
    width:90%;
    max-width:380px;
    text-align:center;
    background:#202c33;
    padding:35px 25px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
    font-size:30px;
    font-weight:bold;
    margin-bottom:10px;
}

.logo span{
    color:#25d366;
}

p{
    color:#aebac1;
    line-height:1.5;
    margin-bottom:28px;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#25d366;
    color:#071b12;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.small{
    margin-top:15px;
    font-size:12px;
    color:#8696a0;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        Great <span>Assistance</span>
    </div>

    <p>
        Open Great Assistance Chat in your browser
        for the best messaging and video-call experience.
    </p>

    <button onclick="openChat()">
        OPEN CHAT
    </button>

    <div class="small">
        Secure messaging • Video calls
    </div>

</div>

<script>

function openChat(){

    const chatURL =
    "https://creativeonlinebranding-png.github.io/Great-Assistance-Chat/";

    /*
      Try opening the chat in a new browser window/tab.
    */

    const newWindow =
    window.open(
        chatURL,
        "_blank"
    );

    /*
      Fallback if the WebView blocks window.open.
    */

    if(!newWindow){

        window.location.href =
        chatURL;

    }

}

</script>

</body>
</html>
