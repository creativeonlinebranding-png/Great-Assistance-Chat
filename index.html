<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Great Assistance Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111b21;
    color: white;
    height: 100vh;
}

button,
input {
    font-family: inherit;
}

#authScreen {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
    linear-gradient(
        135deg,
        #111b21,
        #1c3138
    );

}

.authBox {

    width: 100%;

    max-width: 400px;

    background: #202c33;

    padding: 30px 25px;

    border-radius: 18px;

}

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #25d366;

    margin-bottom: 8px;

}

.subtitle {

    text-align: center;

    color: #8696a0;

    margin-bottom: 25px;

}

.authInput {

    width: 100%;

    padding: 15px;

    margin-bottom: 12px;

    border: none;

    outline: none;

    border-radius: 10px;

    background: #2a3942;

    color: white;

    font-size: 15px;

}

.mainButton {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #25d366;

    color: #071b12;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

.secondaryButton {

    width: 100%;

    padding: 13px;

    margin-top: 8px;

    border: none;

    background: transparent;

    color: #25d366;

    cursor: pointer;

}

.authMessage {

    text-align: center;

    margin-top: 15px;

    color: #ff7777;

    font-size: 13px;

}

#registerForm {
    display: none;
}

#appScreen {

    display: none;

    height: 100vh;

}

.topHeader {

    height: 65px;

    background: #202c33;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

}

.appTitle {

    font-size: 21px;

    font-weight: bold;

}

.appTitle span {
    color: #25d366;
}

.logoutButton {

    border: none;

    background: #2a3942;

    color: white;

    padding: 9px 14px;

    border-radius: 8px;

}

.mainContent {

    height: calc(100vh - 65px);

    display: flex;

}

.usersPanel {

    width: 100%;

    max-width: 400px;

    overflow-y: auto;

    background: #111b21;

}

.chatsTitle {

    padding: 18px;

    font-size: 19px;

    font-weight: bold;

    border-bottom:
    1px solid #202c33;

}

.userItem {

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 14px;

    border-bottom:
    1px solid #202c33;

    cursor: pointer;

}

.userItem:hover {

    background: #202c33;

}

.avatar {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background: #25d366;

    color: #071b12;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 20px;

    font-weight: bold;

    flex-shrink: 0;

}

.userInfo {
    min-width: 0;
}

.userName {
    font-weight: bold;
}

.userStatus {

    font-size: 12px;

    margin-top: 4px;

}

.online {
    color: #25d366;
}

.offline {
    color: #8696a0;
}

.chatPanel {

    flex: 1;

    display: none;

    flex-direction: column;

    background: #0b141a;

}

.chatHeader {

    height: 65px;

    background: #202c33;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 0 12px;

}

.backButton {

    border: none;

    background: transparent;

    color: white;

    font-size: 28px;

}

.chatUserName {
    font-weight: bold;
}

.chatStatus {

    font-size: 12px;

    margin-top: 3px;

}

.callButton {

    margin-left: auto;

    border: none;

    background: #25d366;

    color: #071b12;

    width: 44px;

    height: 44px;

    border-radius: 50%;

    font-size: 20px;

}

.chatMessages {

    flex: 1;

    overflow-y: auto;

    padding: 15px;

    display: flex;

    flex-direction: column;

    gap: 7px;

}

.emptyChat {

    margin: auto;

    text-align: center;

    color: #8696a0;

}

.message {

    max-width: 78%;

    padding: 9px 12px;

    border-radius: 9px;

    font-size: 15px;

    line-height: 1.4;

    word-break: break-word;

}

.sent {

    align-self: flex-end;

    background: #005c4b;

}

.received {

    align-self: flex-start;

    background: #202c33;

}

.messageTime {

    display: block;

    text-align: right;

    color: #aebac1;

    font-size: 10px;

    margin-top: 4px;

}

.messageBox {

    min-height: 65px;

    padding: 10px;

    background: #202c33;

    display: flex;

    gap: 8px;

    align-items: center;

}

.messageInput {

    flex: 1;

    border: none;

    outline: none;

    background: #2a3942;

    color: white;

    padding: 13px 16px;

    border-radius: 25px;

}

.sendButton {

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: #25d366;

    font-size: 18px;

}


/* =====================================
   INCOMING CALL
===================================== */

#incomingCall {

    display: none;

    position: fixed;

    inset: 0;

    background:
    rgba(0,0,0,0.88);

    z-index: 999;

    justify-content: center;

    align-items: center;

    padding: 20px;

}

.incomingBox {

    width: 100%;

    max-width: 380px;

    background: #202c33;

    border-radius: 20px;

    padding: 30px;

    text-align: center;

}

.incomingIcon {

    font-size: 60px;

    margin-bottom: 15px;

}

.incomingTitle {

    font-size: 24px;

    font-weight: bold;

}

.incomingName {

    color: #25d366;

    font-size: 20px;

    margin-top: 10px;

}

.incomingButtons {

    display: flex;

    gap: 10px;

    margin-top: 25px;

}

.incomingButtons button {

    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 10px;

    font-weight: bold;

    font-size: 15px;

}

.acceptButton {

    background: #25d366;

    color: #071b12;

}

.declineButton {

    background: #e53935;

    color: white;

}


@media (max-width: 700px) {

    .usersPanel {

        max-width: none;

    }

    .chatPanel {

        position: fixed;

        inset: 0;

        z-index: 50;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="authScreen">

    <div class="authBox">

        <div class="logo">
            Great Assistance
        </div>

        <div
            class="subtitle"
            id="authSubtitle">

            Secure messaging

        </div>


        <div id="loginForm">

            <input
                id="loginEmail"
                class="authInput"
                type="email"
                placeholder="Email address">

            <input
                id="loginPassword"
                class="authInput"
                type="password"
                placeholder="Password">

            <button
                id="loginButton"
                class="mainButton">

                Login

            </button>

            <button
                id="showRegisterButton"
                class="secondaryButton">

                Create new account

            </button>

        </div>


        <div id="registerForm">

            <input
                id="registerName"
                class="authInput"
                type="text"
                placeholder="Your name">

            <input
                id="registerEmail"
                class="authInput"
                type="email"
                placeholder="Email address">

            <input
                id="registerPassword"
                class="authInput"
                type="password"
                placeholder="Password">

            <button
                id="createAccountButton"
                class="mainButton">

                Create Account

            </button>

            <button
                id="showLoginButton"
                class="secondaryButton">

                Back to Login

            </button>

        </div>


        <div
            id="authMessage"
            class="authMessage">
        </div>

    </div>

</div>


<!-- =========================
     MAIN APP
========================= -->

<div id="appScreen">

    <div class="topHeader">

        <div class="appTitle">

            Great
            <span>Assistance</span>

        </div>

        <button
            id="logoutButton"
            class="logoutButton">

            Logout

        </button>

    </div>


    <div class="mainContent">


        <div
            id="usersPanel"
            class="usersPanel">

            <div class="chatsTitle">
                Chats
            </div>

            <div id="usersList">

                <div style="
                    padding:30px;
                    text-align:center;
                    color:#8696a0">

                    Loading users...

                </div>

            </div>

        </div>


        <div
            id="chatPanel"
            class="chatPanel">


            <div class="chatHeader">

                <button
                    id="backButton"
                    class="backButton">

                    ‹

                </button>


                <div
                    id="chatAvatar"
                    class="avatar">

                    ?

                </div>


                <div>

                    <div
                        id="chatUserName"
                        class="chatUserName">

                        User

                    </div>


                    <div
                        id="chatStatus"
                        class="chatStatus">

                        offline

                    </div>

                </div>


                <button
                    id="videoCallButton"
                    class="callButton">

                    📹

                </button>

            </div>


            <div
                id="chatMessages"
                class="chatMessages">
            </div>


            <div class="messageBox">

                <input
                    id="messageInput"
                    class="messageInput"
                    type="text"
                    placeholder="Type a message...">

                <button
                    id="sendButton"
                    class="sendButton">

                    ➤

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     INCOMING CALL
========================= -->

<div id="incomingCall">

    <div class="incomingBox">

        <div class="incomingIcon">
            📹
        </div>

        <div class="incomingTitle">
            Incoming Video Call
        </div>

        <div
            id="incomingCallerName"
            class="incomingName">

            User

        </div>


        <div class="incomingButtons">

            <button
                id="declineCallButton"
                class="declineButton">

                Decline

            </button>

            <button
                id="acceptCallButton"
                class="acceptButton">

                Accept

            </button>

        </div>

    </div>

</div>


<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    onDisconnect,
    update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyCrytf77WuZJthewnFLy5XL6i5Xh0vAW7o",

    authDomain:
    "great-assistance.firebaseapp.com",

    databaseURL:
    "https://great-assistance-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "great-assistance",

    storageBucket:
    "great-assistance.firebasestorage.app",

    messagingSenderId:
    "673899916289",

    appId:
    "1:673899916289:web:4c1f2b0845342309f62400"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);


/* =====================================
   VARIABLES
===================================== */

let currentUser = null;

let selectedUser = null;

let currentIncomingCall = null;

let stopUsersListener = null;

let stopMessagesListener = null;

let stopIncomingCallListener = null;


/* =====================================
   ELEMENTS
===================================== */

const authScreen =
document.getElementById("authScreen");

const appScreen =
document.getElementById("appScreen");

const authMessage =
document.getElementById("authMessage");

const loginForm =
document.getElementById("loginForm");

const registerForm =
document.getElementById("registerForm");

const usersList =
document.getElementById("usersList");

const chatPanel =
document.getElementById("chatPanel");

const chatMessages =
document.getElementById("chatMessages");

const messageInput =
document.getElementById("messageInput");

const incomingCall =
document.getElementById("incomingCall");


/* =====================================
   AUTH MESSAGE
===================================== */

function showMessage(text) {

    authMessage.textContent =
    text;

}


/* =====================================
   REGISTER SCREEN
===================================== */

document
.getElementById("showRegisterButton")
.onclick =
() => {

    loginForm.style.display =
    "none";

    registerForm.style.display =
    "block";

    document.getElementById(
        "authSubtitle"
    ).textContent =
    "Create your account";

    showMessage("");

};


/* =====================================
   LOGIN SCREEN
===================================== */

document
.getElementById("showLoginButton")
.onclick =
() => {

    registerForm.style.display =
    "none";

    loginForm.style.display =
    "block";

    document.getElementById(
        "authSubtitle"
    ).textContent =
    "Secure messaging";

    showMessage("");

};


/* =====================================
   LOGIN
===================================== */

document
.getElementById("loginButton")
.onclick =
async () => {

    const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();

    const password =
    document
    .getElementById("loginPassword")
    .value;


    if (!email || !password) {

        showMessage(
            "Please enter your email and password."
        );

        return;

    }


    showMessage(
        "Signing in..."
    );


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message
        );

    }

};


/* =====================================
   CREATE ACCOUNT
===================================== */

document
.getElementById("createAccountButton")
.onclick =
async () => {

    const name =
    document
    .getElementById("registerName")
    .value
    .trim();

    const email =
    document
    .getElementById("registerEmail")
    .value
    .trim();

    const password =
    document
    .getElementById("registerPassword")
    .value;


    if (!name) {

        showMessage(
            "Please enter your name."
        );

        return;

    }


    if (!email) {

        showMessage(
            "Please enter your email."
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;

    }


    showMessage(
        "Creating account..."
    );


    try {

        const result =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        await set(

            ref(
                database,
                "users/" +
                result.user.uid
            ),

            {

                name:
                name,

                email:
                result.user.email,

                online:
                true,

                createdAt:
                Date.now()

            }

        );


        showMessage(
            "Account created successfully!"
        );

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message
        );

    }

};


/* =====================================
   PRESENCE
===================================== */

function setupPresence(user) {

    const connectedRef =
    ref(
        database,
        ".info/connected"
    );


    onValue(

        connectedRef,

        async snapshot => {

            if (
                snapshot.val() !== true
            ) {

                return;

            }


            const statusRef =
            ref(
                database,
                "users/" +
                user.uid +
                "/online"
            );


            await onDisconnect(
                statusRef
            ).set(false);


            await set(
                statusRef,
                true
            );

        }

    );

}


/* =====================================
   AUTH STATE
===================================== */

onAuthStateChanged(

    auth,

    async user => {

        if (!user) {

            currentUser =
            null;

            authScreen.style.display =
            "flex";

            appScreen.style.display =
            "none";

            return;

        }


        currentUser =
        user;


        authScreen.style.display =
        "none";

        appScreen.style.display =
        "block";


        setupPresence(user);

        loadUsers();

        listenForIncomingCalls();

    }

);


/* =====================================
   LOGOUT
===================================== */

document
.getElementById("logoutButton")
.onclick =
async () => {

    try {

        if (currentUser) {

            await set(

                ref(
                    database,
                    "users/" +
                    currentUser.uid +
                    "/online"
                ),

                false

            );

        }


        await signOut(auth);

    }

    catch(error) {

        console.error(error);

    }

};


/* =====================================
   LOAD USERS
===================================== */

function loadUsers() {

    const usersRef =
    ref(
        database,
        "users"
    );


    stopUsersListener =
    onValue(

        usersRef,

        snapshot => {

            usersList.innerHTML =
            "";


            const users =
            snapshot.val() || {};


            let found =
            false;


            Object.entries(users)
            .forEach(
                ([uid, user]) => {

                    if (
                        !currentUser ||
                        uid === currentUser.uid
                    ) {

                        return;

                    }


                    found =
                    true;


                    const item =
                    document.createElement(
                        "div"
                    );


                    item.className =
                    "userItem";


                    const name =
                    user.name ||
                    "User";


                    const online =
                    user.online === true;


                    item.innerHTML = `

                        <div class="avatar">

                            ${escapeHTML(
                                name
                                .charAt(0)
                                .toUpperCase()
                            )}

                        </div>


                        <div class="userInfo">

                            <div class="userName">

                                ${escapeHTML(name)}

                            </div>


                            <div class="
                                userStatus
                                ${
                                    online
                                    ? "online"
                                    : "offline"
                                }
                            ">

                                ${
                                    online
                                    ? "🟢 online"
                                    : "⚫ offline"
                                }

                            </div>

                        </div>

                    `;


                    item.onclick =
                    () => {

                        openChat(
                            uid,
                            user
                        );

                    };


                    usersList.appendChild(
                        item
                    );

                }
            );


            if (!found) {

                usersList.innerHTML = `

                    <div style="
                        padding:30px;
                        text-align:center;
                        color:#8696a0">

                        No other users found.

                    </div>

                `;

            }

        }

    );

}


/* =====================================
   OPEN CHAT
===================================== */

function openChat(
    uid,
    user
) {

    selectedUser = {

        uid:
        uid,

        name:
        user.name ||
        "User"

    };


    chatPanel.style.display =
    "flex";


    document.getElementById(
        "chatUserName"
    ).textContent =
    selectedUser.name;


    document.getElementById(
        "chatAvatar"
    ).textContent =
    selectedUser.name
    .charAt(0)
    .toUpperCase();


    watchSelectedUser();

    loadMessages();

}


/* =====================================
   WATCH SELECTED USER
===================================== */

function watchSelectedUser() {

    if (!selectedUser) {

        return;

    }


    onValue(

        ref(
            database,
            "users/" +
            selectedUser.uid
        ),

        snapshot => {

            const user =
            snapshot.val();


            if (!user) {

                return;

            }


            const online =
            user.online === true;


            const status =
            document.getElementById(
                "chatStatus"
            );


            status.textContent =
            online
            ? "🟢 online"
            : "⚫ offline";


            status.className =
            online
            ? "chatStatus online"
            : "chatStatus offline";

        }

    );

}


/* =====================================
   CHAT ID
===================================== */

function getChatID() {

    return [

        currentUser.uid,

        selectedUser.uid

    ]
    .sort()
    .join("_");

}


/* =====================================
   LOAD MESSAGES
===================================== */

function loadMessages() {

    if (stopMessagesListener) {

        stopMessagesListener();

    }


    stopMessagesListener =
    onValue(

        ref(
            database,
            "messages/" +
            getChatID()
        ),

        snapshot => {

            chatMessages.innerHTML =
            "";


            const messages =
            Object.values(
                snapshot.val() || {}
            )
            .sort(
                (a,b) =>
                (a.timestamp || 0) -
                (b.timestamp || 0)
            );


            if (!messages.length) {

                chatMessages.innerHTML = `

                    <div class="emptyChat">

                        No messages yet.<br>

                        Say hello! 👋

                    </div>

                `;

                return;

            }


            messages.forEach(
                message => {

                    const div =
                    document.createElement(
                        "div"
                    );


                    const sent =
                    message.sender ===
                    currentUser.uid;


                    div.className =
                    "message " +
                    (
                        sent
                        ? "sent"
                        : "received"
                    );


                    const time =
                    new Date(
                        message.timestamp ||
                        Date.now()
                    )
                    .toLocaleTimeString(
                        [],
                        {
                            hour:
                            "2-digit",

                            minute:
                            "2-digit"
                        }
                    );


                    div.innerHTML = `

                        ${escapeHTML(
                            message.text ||
                            ""
                        )}

                        <span
                            class="messageTime">

                            ${time}

                        </span>

                    `;


                    chatMessages.appendChild(
                        div
                    );

                }
            );


            chatMessages.scrollTop =
            chatMessages.scrollHeight;

        }

    );

}


/* =====================================
   SEND MESSAGE
===================================== */

async function sendMessage() {

    if (!selectedUser) {

        return;

    }


    const text =
    messageInput.value.trim();


    if (!text) {

        return;

    }


    await set(

        push(

            ref(
                database,
                "messages/" +
                getChatID()
            )

        ),

        {

            sender:
            currentUser.uid,

            receiver:
            selectedUser.uid,

            text:
            text,

            timestamp:
            Date.now()

        }

    );


    messageInput.value =
    "";

}


document
.getElementById("sendButton")
.onclick =
sendMessage;


messageInput
.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================
   BACK
===================================== */

document
.getElementById("backButton")
.onclick =
() => {

    chatPanel.style.display =
    "none";

    selectedUser =
    null;

};


/* =====================================
   START OUTGOING CALL
===================================== */

document
.getElementById("videoCallButton")
.onclick =
async () => {

    if (!selectedUser) {

        alert(
            "Please select a user first."
        );

        return;

    }


    const callRef =
    push(
        ref(
            database,
            "calls"
        )
    );


    const callId =
    callRef.key;


    await set(

        callRef,

        {

            caller:
            currentUser.uid,

            callee:
            selectedUser.uid,

            callerName:
            await getCurrentUserName(),

            status:
            "ringing",

            createdAt:
            Date.now()

        }

    );


    /*
       Save the call ID locally so the
       Video Call page can use the same call.
    */

    const videoURL =

    "https://creativeonlinebranding-png.github.io/Great-Assistance-Video-Call/"
    +
    "?call=" +
    encodeURIComponent(callId)
    +
    "&uid=" +
    encodeURIComponent(currentUser.uid);


    window.open(
        videoURL,
        "_blank"
    );

};


/* =====================================
   CURRENT USER NAME
===================================== */

async function getCurrentUserName() {

    return new Promise(
        resolve => {

            onValue(

                ref(
                    database,
                    "users/" +
                    currentUser.uid +
                    "/name"
                ),

                snapshot => {

                    resolve(
                        snapshot.val() ||
                        "Great Assistance User"
                    );

                },

                {
                    onlyOnce:
                    true
                }

            );

        }
    );

}


/* =====================================
   INCOMING CALLS
===================================== */

function listenForIncomingCalls() {

    if (!currentUser) {

        return;

    }


    if (stopIncomingCallListener) {

        stopIncomingCallListener();

    }


    stopIncomingCallListener =
    onValue(

        ref(
            database,
            "calls"
        ),

        snapshot => {

            const calls =
            snapshot.val() || {};


            let foundCall =
            null;


            Object.entries(calls)
            .forEach(
                ([callId, call]) => {

                    if (

                        call.callee ===
                        currentUser.uid

                        &&

                        call.status ===
                        "ringing"

                    ) {

                        foundCall = {

                            id:
                            callId,

                            ...call

                        };

                    }

                }
            );


            if (foundCall) {

                showIncomingCall(
                    foundCall
                );

            }

        }

    );

}


/* =====================================
   SHOW INCOMING CALL
===================================== */

function showIncomingCall(call) {

    currentIncomingCall =
    call;


    document.getElementById(
        "incomingCallerName"
    ).textContent =

    call.callerName ||
    "Great Assistance User";


    incomingCall.style.display =
    "flex";

}


/* =====================================
   ACCEPT CALL
===================================== */

document
.getElementById("acceptCallButton")
.onclick =
async () => {

    if (!currentIncomingCall) {

        return;

    }


    const call =
    currentIncomingCall;


    incomingCall.style.display =
    "none";


    /*
       Phone B opens the same call
       using the call ID and its own UID.
    */

    const videoURL =

    "https://creativeonlinebranding-png.github.io/Great-Assistance-Video-Call/"
    +
    "?call=" +
    encodeURIComponent(
        call.id
    )
    +
    "&uid=" +
    encodeURIComponent(
        currentUser.uid
    );


    await update(

        ref(
            database,
            "calls/" +
            call.id
        ),

        {

            status:
            "accepted"

        }

    );


    window.open(
        videoURL,
        "_blank"
    );


    currentIncomingCall =
    null;

};


/* =====================================
   DECLINE CALL
===================================== */

document
.getElementById("declineCallButton")
.onclick =
async () => {

    if (!currentIncomingCall) {

        return;

    }


    await update(

        ref(
            database,
            "calls/" +
            currentIncomingCall.id
        ),

        {

            status:
            "declined"

        }

    );


    incomingCall.style.display =
    "none";


    currentIncomingCall =
    null;

};


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value) {

    const div =
    document.createElement(
        "div"
    );


    div.textContent =
    String(value);


    return div.innerHTML;

}

</script>
