<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Great Assistance</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#111b21;
    color:white;
    height:100vh;
    overflow:hidden;
}

/* AUTH */

#authScreen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(145deg,#111b21,#172c34);
}

.authBox{
    width:100%;
    max-width:400px;
    background:#202c33;
    padding:30px 24px;
    border-radius:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    color:#25d366;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8696a0;
    margin-bottom:25px;
}

.authInput{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#2a3942;
    color:white;
    font-size:15px;
}

.mainButton{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#25d366;
    color:#071b12;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.secondaryButton{
    width:100%;
    padding:13px;
    border:none;
    background:transparent;
    color:#25d366;
    cursor:pointer;
}

.authMessage{
    text-align:center;
    color:#ff7777;
    margin-top:12px;
    font-size:13px;
    line-height:1.5;
}

#registerForm{
    display:none;
}

/* APP */

#appScreen{
    display:none;
    height:100vh;
}

.topHeader{
    height:65px;
    background:#202c33;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #2a3942;
}

.appTitle{
    font-size:21px;
    font-weight:bold;
}

.appTitle span{
    color:#25d366;
}

.logoutButton{
    border:none;
    background:#2a3942;
    color:white;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
}

.mainContent{
    height:calc(100vh - 65px);
    display:flex;
}

.usersPanel{
    width:100%;
    max-width:400px;
    background:#111b21;
    overflow-y:auto;
}

.chatsTitle{
    padding:18px;
    font-size:19px;
    font-weight:bold;
    border-bottom:1px solid #202c33;
}

.userItem{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px;
    border-bottom:1px solid #202c33;
    cursor:pointer;
}

.userItem:hover{
    background:#202c33;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#25d366;
    color:#071b12;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    flex-shrink:0;
}

.userInfo{
    min-width:0;
}

.userName{
    font-weight:bold;
    font-size:15px;
}

.userStatus{
    color:#8696a0;
    font-size:12px;
    margin-top:4px;
}

/* CHAT */

.chatPanel{
    flex:1;
    display:none;
    flex-direction:column;
    background:#0b141a;
}

.chatHeader{
    height:65px;
    background:#202c33;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
}

.backButton{
    border:none;
    background:transparent;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.chatUserName{
    font-weight:bold;
}

.chatStatus{
    color:#8696a0;
    font-size:12px;
    margin-top:3px;
}

.callButton{
    margin-left:auto;
    border:none;
    background:#25d366;
    color:#071b12;
    width:42px;
    height:42px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.chatMessages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.emptyChat{
    margin:auto;
    text-align:center;
    color:#8696a0;
}

.message{
    max-width:78%;
    padding:9px 12px;
    border-radius:9px;
    font-size:15px;
    line-height:1.4;
    word-break:break-word;
}

.sent{
    align-self:flex-end;
    background:#005c4b;
}

.received{
    align-self:flex-start;
    background:#202c33;
}

.messageTime{
    display:block;
    text-align:right;
    color:#aebac1;
    font-size:10px;
    margin-top:4px;
}

.messageBox{
    min-height:65px;
    padding:10px;
    background:#202c33;
    display:flex;
    align-items:center;
    gap:8px;
}

.messageInput{
    flex:1;
    border:none;
    outline:none;
    background:#2a3942;
    color:white;
    padding:13px 16px;
    border-radius:25px;
}

.sendButton{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#25d366;
    cursor:pointer;
    font-size:18px;
}

/* VIDEO */

#callScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
}

#remoteVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

#localVideo{
    position:absolute;
    right:15px;
    top:15px;
    width:125px;
    height:175px;
    object-fit:cover;
    background:#222;
    border-radius:12px;
    border:2px solid white;
    z-index:5;
}

.callInfo{
    position:absolute;
    top:15px;
    left:15px;
    z-index:10;
    background:rgba(0,0,0,.55);
    padding:10px 15px;
    border-radius:10px;
}

.callName{
    font-size:18px;
    font-weight:bold;
}

.callStatus{
    font-size:13px;
    color:#ccc;
    margin-top:4px;
}

.callControls{
    position:absolute;
    bottom:30px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:15px;
    z-index:10;
}

.callControl{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:#333;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.endCall{
    background:#e53935;
}

/* INCOMING */

#incomingCall{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.95);
    align-items:center;
    justify-content:center;
    text-align:center;
}

.incomingBox{
    padding:30px;
}

.incomingAvatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#25d366;
    color:#071b12;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    margin:0 auto 20px;
}

.incomingName{
    font-size:25px;
    font-weight:bold;
    margin-bottom:10px;
}

.incomingText{
    color:#aaa;
    margin-bottom:30px;
}

.incomingButtons{
    display:flex;
    justify-content:center;
    gap:25px;
}

.acceptButton,
.rejectButton{
    width:65px;
    height:65px;
    border:none;
    border-radius:50%;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.acceptButton{
    background:#25d366;
}

.rejectButton{
    background:#e53935;
}

@media(max-width:700px){

    .usersPanel{
        max-width:none;
    }

    .chatPanel{
        position:fixed;
        inset:0;
        z-index:50;
    }

    #localVideo{
        width:105px;
        height:145px;
    }
}
</style>
</head>

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    push,
    get,
    remove,
    onValue,
    onDisconnect
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
    "AIzaSyCrytf77WuZJthewnFLy5XL6i5Xh0vAW7o",

    authDomain:
    "great-assistance.firebaseapp.com",

    databaseURL:
    "https://great-assistance-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "great-assistance",

    storageBucket:
    "great-assistance.firebasestorage.app",

    messagingSenderId:
    "673899916289",

    appId:
    "1:673899916289:web:4c1f2b0845342309f62400"
};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);


/* VARIABLES */

let currentUser = null;
let selectedUser = null;

let stopUsersListener = null;
let stopMessagesListener = null;
let stopIncomingCalls = null;

let currentCallId = null;
let peerConnection = null;
let localStream = null;


/* ELEMENTS */

const authScreen =
document.getElementById("authScreen");

const appScreen =
document.getElementById("appScreen");

const loginForm =
document.getElementById("loginForm");

const registerForm =
document.getElementById("registerForm");

const authMessage =
document.getElementById("authMessage");

const usersList =
document.getElementById("usersList");

const chatPanel =
document.getElementById("chatPanel");

const chatMessages =
document.getElementById("chatMessages");

const messageInput =
document.getElementById("messageInput");

const callScreen =
document.getElementById("callScreen");

const incomingCall =
document.getElementById("incomingCall");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");


/* WEBRTC */

const rtcConfig = {

    iceServers: [

        {
            urls:
            "stun:stun.l.google.com:19302"
        },

        {
            urls:
            "stun:stun1.l.google.com:19302"
        }

    ]

};


/* MESSAGE */

function showMessage(text){

    authMessage.textContent =
    text;

}


/* REGISTER SCREEN */

document
.getElementById("showRegisterButton")
.onclick = function(){

    loginForm.style.display =
    "none";

    registerForm.style.display =
    "block";

    document.getElementById(
        "authSubtitle"
    ).textContent =
    "Create your account";

    showMessage("");

};


document
.getElementById("showLoginButton")
.onclick = function(){

    registerForm.style.display =
    "none";

    loginForm.style.display =
    "block";

    document.getElementById(
        "authSubtitle"
    ).textContent =
    "Secure messaging";

    showMessage("");

};


/* LOGIN */

document
.getElementById("loginButton")
.onclick = async function(){

    const email =
    document.getElementById(
        "loginEmail"
    ).value.trim();

    const password =
    document.getElementById(
        "loginPassword"
    ).value;

    if(!email || !password){

        showMessage(
            "Please enter your email and password."
        );

        return;
    }

    showMessage("Signing in...");

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(error);

        showMessage(
            error.message
        );

    }

};


/* CREATE ACCOUNT */

document
.getElementById("createAccountButton")
.onclick = async function(){

    const name =
    document.getElementById(
        "registerName"
    ).value.trim();

    const email =
    document.getElementById(
        "registerEmail"
    ).value.trim();

    const password =
    document.getElementById(
        "registerPassword"
    ).value;

    if(!name){

        showMessage(
            "Please enter your name."
        );

        return;
    }

    if(!email){

        showMessage(
            "Please enter your email."
        );

        return;
    }

    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;
    }

    showMessage(
        "Creating account..."
    );

    try{

        const result =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        await set(
            ref(
                database,
                "users/" +
                result.user.uid
            ),
            {

                name:name,

                email:result.user.email,

                online:true,

                createdAt:
                Date.now()

            }
        );

    }catch(error){

        console.error(error);

        showMessage(
            error.message
        );

    }

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async function(user){

    if(user){

        currentUser =
        user;

        authScreen.style.display =
        "none";

        appScreen.style.display =
        "block";

        try{

            const userRef =
            ref(
                database,
                "users/" +
                user.uid
            );

            await set(
                ref(
                    database,
                    "users/" +
                    user.uid +
                    "/online"
                ),
                true
            );

            onDisconnect(
                ref(
                    database,
                    "users/" +
                    user.uid +
                    "/online"
                )
            ).set(false);

            loadUsers();

            listenForIncomingCalls();

        }catch(error){

            console.error(error);

        }

    }else{

        currentUser =
        null;

        authScreen.style.display =
        "flex";

        appScreen.style.display =
        "none";
    }

});


/* LOGOUT */

document
.getElementById("logoutButton")
.onclick = async function(){

    await endCall();

    if(currentUser){

        await set(
            ref(
                database,
                "users/" +
                currentUser.uid +
                "/online"
            ),
            false
        );

    }

    await signOut(auth);

};


/* USERS */

function loadUsers(){

    const usersRef =
    ref(
        database,
        "users"
    );

    if(stopUsersListener){
        stopUsersListener();
    }

    stopUsersListener =
    onValue(
        usersRef,
        function(snapshot){

            usersList.innerHTML =
            "";

            const users =
            snapshot.val() || {};

            let found =
            false;

            Object.entries(users)
            .forEach(
            function([uid,user]){

                if(
                    !currentUser ||
                    uid === currentUser.uid
                ){

                    return;
                }

                found =
                true;

                const item =
                document.createElement(
                    "div"
                );

                item.className =
                "userItem";

                const name =
                user.name ||
                "User";

                item.innerHTML = `

                    <div class="avatar">
                        ${escapeHTML(
                            name.charAt(0)
                            .toUpperCase()
                        )}
                    </div>

                    <div class="userInfo">

                        <div class="userName">
                            ${escapeHTML(name)}
                        </div>

                        <div class="userStatus">
                            ${
                                user.online
                                ? "online"
                                : "offline"
                            }
                        </div>

                    </div>
                `;

                item.onclick =
                function(){

                    openChat(
                        uid,
                        user
                    );

                };

                usersList.appendChild(
                    item
                );

            });

            if(!found){

                usersList.innerHTML = `
                    <div style="
                        padding:30px;
                        text-align:center;
                        color:#8696a0;
                    ">
                        No other users found.
                    </div>
                `;

            }

        }
    );

}


/* OPEN CHAT */

function openChat(uid,user){

    selectedUser = {

        uid:uid,

        name:
        user.name ||
        "User",

        online:
        user.online ||
        false

    };

    chatPanel.style.display =
    "flex";

    document.getElementById(
        "chatUserName"
    ).textContent =
    selectedUser.name;

    document.getElementById(
        "chatAvatar"
    ).textContent =
    selectedUser.name
    .charAt(0)
    .toUpperCase();

    document.getElementById(
        "chatStatus"
    ).textContent =
    selectedUser.online
    ? "online"
    : "offline";

    loadMessages();

}


/* CHAT ID */

function getChatID(){

    return [
        currentUser.uid,
        selectedUser.uid
    ]
    .sort()
    .join("_");

}


/* MESSAGES */

function loadMessages(){

    if(
        !currentUser ||
        !selectedUser
    ){
        return;
    }

    if(stopMessagesListener){
        stopMessagesListener();
    }

    const messagesRef =
    ref(
        database,
        "messages/" +
        getChatID()
    );

    stopMessagesListener =
    onValue(
        messagesRef,
        function(snapshot){

            chatMessages.innerHTML =
            "";

            const data =
            snapshot.val() || {};

            const messages =
            Object.values(data)
            .sort(
                (a,b) =>
                (a.timestamp || 0) -
                (b.timestamp || 0)
            );

            if(!messages.length){

                chatMessages.innerHTML = `
                    <div class="emptyChat">
                        No messages yet.<br>
                        Say hello! 👋
                    </div>
                `;

                return;
            }

            messages.forEach(
            function(message){

                const div =
                document.createElement(
                    "div"
                );

                const sent =
                message.sender ===
                currentUser.uid;

                div.className =
                "message " +
                (
                    sent
                    ? "sent"
                    : "received"
                );

                const time =
                new Date(
                    message.timestamp ||
                    Date.now()
                )
                .toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

                div.innerHTML = `

                    ${escapeHTML(
                        message.text || ""
                    )}

                    <span class="messageTime">
                        ${time}
                    </span>
                `;

                chatMessages.appendChild(
                    div
                );

            });

            chatMessages.scrollTop =
            chatMessages.scrollHeight;

        }
    );

}


/* SEND */

async function sendMessage(){

    if(
        !currentUser ||
        !selectedUser
    ){
        return;
    }

    const text =
    messageInput.value.trim();

    if(!text){
        return;
    }

    const messageRef =
    push(
        ref(
            database,
            "messages/" +
            getChatID()
        )
    );

    await set(
        messageRef,
        {

            sender:
            currentUser.uid,

            receiver:
            selectedUser.uid,

            text:text,

            timestamp:
            Date.now()

        }
    );

    messageInput.value =
    "";

}


document
.getElementById("sendButton")
.onclick =
sendMessage;


messageInput
.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

});


/* BACK */

document
.getElementById("backButton")
.onclick =

/* =================================================
VIDEO CALL
================================================= */

document
.getElementById("videoCallButton")
.onclick =
startCall;


async function getCameraAndMicrophone(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "This browser does not support camera access."
        );

    }

    console.log(
        "Requesting camera and microphone..."
    );

    const stream =
    await navigator.mediaDevices.getUserMedia({

        video:{
            facingMode:"user"
        },

        audio:true

    });

    console.log(
        "Camera and microphone permission granted."
    );

    return stream;

}


/* START CALL */

async function startCall(){

    if(
        !currentUser ||
        !selectedUser
    ){
        return;
    }

    try{

        /* CAMERA FIRST */

        localStream =
        await getCameraAndMicrophone();

        localVideo.srcObject =
        localStream;

        /* PEER */

        peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );

        /* LOCAL TRACKS */

        localStream
        .getTracks()
        .forEach(
            track =>
            peerConnection.addTrack(
                track,
                localStream
            )
        );

        /* REMOTE */

        peerConnection.ontrack =
        function(event){

            console.log(
                "REMOTE STREAM RECEIVED"
            );

            if(
                event.streams &&
                event.streams[0]
            ){

                remoteVideo.srcObject =
                event.streams[0];

            }

        };

        /* ICE */

        const callRef =
        push(
            ref(
                database,
                "calls"
            )
        );

        currentCallId =
        callRef.key;

        peerConnection.onicecandidate =
        async function(event){

            if(
                event.candidate
            ){

                const candidateKey =
                push(
                    ref(
                        database,
                        "calls/" +
                        currentCallId +
                        "/callerCandidates"
                    )
                ).key;

                await set(
                    ref(
                        database,
                        "calls/" +
                        currentCallId +
                        "/callerCandidates/" +
                        candidateKey
                    ),
                    event.candidate.toJSON()
                );

            }

        };

        /* OFFER */

        const offer =
        await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
            offer
        );

        /* SAVE */

        await set(
            callRef,
            {

                caller:
                currentUser.uid,

                callee:
                selectedUser.uid,

                callerName:
                await getUserName(
                    currentUser.uid
                ),

                status:
                "ringing",

                offer:{
                    type:
                    offer.type,

                    sdp:
                    offer.sdp
                },

                createdAt:
                Date.now()

            }
        );

        callScreen.style.display =
        "block";

        document.getElementById(
            "callName"
        ).textContent =
        selectedUser.name;

        document.getElementById(
            "callStatusText"
        ).textContent =
        "Calling...";

        listenForAnswer();

    }
    catch(error){

        console.error(
            "VIDEO CALL ERROR:",
            error
        );

        alert(
            "Camera error:\n\n" +
            error.name +
            "\n" +
            error.message
        );

        await endCall();

    }

}


/* ANSWER */

function listenForAnswer(){

    const callRef =
    ref(
        database,
        "calls/" +
        currentCallId
    );

    onValue(
        callRef,
        async function(snapshot){

            const call =
            snapshot.val();

            if(!call){
                return;
            }

            if(
                call.answer &&
                peerConnection &&
                !peerConnection.currentRemoteDescription
            ){

                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription(
                        call.answer
                    )
                );

                document.getElementById(
                    "callStatusText"
                ).textContent =
                "Connected";

                listenForCandidates(
                    "calleeCandidates"
                );

            }

        }
    );

}


/* INCOMING CALLS */

function listenForIncomingCalls(){

    const callsRef =
    ref(
        database,
        "calls"
    );

    stopIncomingCalls =
    onValue(
        callsRef,
        function(snapshot){

            const calls =
            snapshot.val() || {};

            Object.entries(calls)
            .forEach(
            function([callId,call]){

                if(
                    call.callee ===
                    currentUser.uid &&

                    call.status ===
                    "ringing"
                ){

                    if(
                        !currentCallId
                    ){

                        showIncomingCall(
                            callId,
                            call
                        );

                    }

                }

            });

        }
    );

}


/* INCOMING UI */

function showIncomingCall(
    callId,
    call
){

    currentCallId =
    callId;

    document.getElementById(
        "incomingName"
    ).textContent =
    call.callerName ||
    "Incoming call";

    document.getElementById(
        "incomingAvatar"
    ).textContent =
    (
        call.callerName ||
        "?"
    )
    .charAt(0)
    .toUpperCase();

    incomingCall.style.display =
    "flex";

}


/* ACCEPT */

document
.getElementById("acceptButton")
.onclick =
acceptCall;


async function acceptCall(){

    if(!currentCallId){
        return;
    }

    try{

        incomingCall.style.display =
        "none";

        const snapshot =
        await get(
            ref(
                database,
                "calls/" +
                currentCallId
            )
        );

        const call =
        snapshot.val();

        if(!call){
            return;
        }

        localStream =
        await getCameraAndMicrophone();

        localVideo.srcObject =
        localStream;

        peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );

        localStream
        .getTracks()
        .forEach(
            track =>
            peerConnection.addTrack(
                track,
                localStream
            )
        );

        peerConnection.ontrack =
        function(event){

            if(
                event.streams &&
                event.streams[0]
            ){

                remoteVideo.srcObject =
                event.streams[0];

            }

        };

        peerConnection.onicecandidate =
        async function(event){

            if(
                event.candidate
            ){

                const candidateKey =
                push(
                    ref(
                        database,
                        "calls/" +
                        currentCallId +
                        "/calleeCandidates"
                    )
                ).key;

                await set(
                    ref(
                        database,
                        "calls/" +
                        currentCallId +
                        "/calleeCandidates/" +
                        candidateKey
                    ),
                    event.candidate.toJSON()
                );

            }

        };

        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                call.offer
            )
        );

        const answer =
        await peerConnection.createAnswer();

        await peerConnection.setLocalDescription(
            answer
        );

        await set(
            ref(
                database,
                "calls/" +
                currentCallId +
                "/answer"
            ),
            {

                type:
                answer.type,

                sdp:
                answer.sdp

            }
        );

        await set(
            ref(
                database,
                "calls/" +
                currentCallId +
                "/status"
            ),
            "accepted"
        );

        callScreen.style.display =
        "block";

        document.getElementById(
            "callName"
        ).textContent =
        call.callerName ||
        "User";

        document.getElementById(
            "callStatusText"
        ).textContent =
        "Connecting...";

        listenForCandidates(
            "callerCandidates"
        );

    }
    catch(error){

        console.error(
            "ACCEPT ERROR:",
            error
        );

        alert(
            "Camera error:\n\n" +
            error.name +
            "\n" +
            error.message
        );

        await endCall();

    }

}


/* CANDIDATES */

function listenForCandidates(
    folder
){

    if(!peerConnection){
        return;
    }

    onValue(
        ref(
            database,
            "calls/" +
            currentCallId +
            "/" +
            folder
        ),
        async function(snapshot){

            const candidates =
            snapshot.val() || {};

            for(
                const key in candidates
            ){

                try{

                    await peerConnection.addIceCandidate(
                        new RTCIceCandidate(
                            candidates[key]
                        )
                    );

                }
                catch(error){

                    console.error(
                        "ICE ERROR:",
                        error
                    );

                }

            }

        }
    );

}


/* REJECT */

document
.getElementById("rejectButton")
.onclick =
async function(){

    incomingCall.style.display =
    "none";

    if(currentCallId){

        await remove(
            ref(
                database,
                "calls/" +
                currentCallId
            )
        );

    }

    currentCallId =
    null;

};


/* END CALL */

document
.getElementById("endCallButton")
.onclick =
endCall;


async function endCall(){

    if(currentCallId){

        try{

            await remove(
                ref(
                    database,
                    "calls/" +
                    currentCallId
                )
            );

        }
        catch(error){

            console.error(error);

        }

    }

    if(peerConnection){

        peerConnection.close();

        peerConnection =
        null;

    }

    if(localStream){

        localStream
        .getTracks()
        .forEach(
            track =>
            track.stop()
        );

        localStream =
        null;

    }

    localVideo.srcObject =
    null;

    remoteVideo.srcObject =
    null;

    currentCallId =
    null;

    callScreen.style.display =
    "none";

    incomingCall.style.display =
    "none";

}


/* MUTE */

document
.getElementById("muteButton")
.onclick =
function(){

    if(!localStream){
        return;
    }

    const track =
    localStream.getAudioTracks()[0];

    if(!track){
        return;
    }

    track.enabled =
    !track.enabled;

    this.textContent =
    track.enabled
    ? "🎤"
    : "🔇";

};


/* CAMERA */

document
.getElementById("cameraButton")
.onclick =
function(){

    if(!localStream){
        return;
    }

    const track =
    localStream.getVideoTracks()[0];

    if(!track){
        return;
    }

    track.enabled =
    !track.enabled;

    this.textContent =
    track.enabled
    ? "📷"
    : "🚫";

};


/* USER NAME */

async function getUserName(uid){

    try{

        const snapshot =
        await get(
            ref(
                database,
                "users/" +
                uid +
                "/name"
            )
        );

        return snapshot.val() ||
        "Great Assistance User";

    }
    catch(error){

        return "Great Assistance User";

    }

}


/* ESCAPE */

function escapeHTML(value){

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    String(value);

    return div.innerHTML;

}
