<style>

*{
box-sizing:border-box;
margin:0;

body{

font-family:Arial,sans-serif;

background:#111b21;

}

/* ================= AUTH ================= */

#authScreen{

height:100vh;

align-items:center;

justify-content:center;

padding:20px;

background:
linear-gradient(
145deg,
#111b21,
#172c34
);

}

.authBox{

width:100%;

max-width:400px;

background:#202c33;

padding:30px 24px;

border-radius:18px;

box-shadow:
0 15px 50px rgba(0,0,0,.45);

}

.logo{

color:#25d366;

font-size:30px;

margin-bottom:8px;

}

.subtitle{

color:#8696a0;

}

.authInput{

width:100%;

padding:15px;

margin-bottom:12px;

border-radius:10px;

background:#2a3942;

font-size:15px;

}

.mainButton{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#25d366;

color:#071b12;

font-size:16px;

}

.secondaryButton{

width:100%;

padding:13px;

border:none;

background:transparent;

color:#25d366;

cursor:pointer;

}

.authMessage{

#registerForm{

}

/* ================= APP ================= */

#appScreen{

display:none;

height:100vh;

}

.topHeader{

background:#202c33;

align-items:center;

}

.appTitle{

font-size:21px;

font-weight:bold;

}

.appTitle span{

color:#25d366;

}

.logoutButton{

border:none;

background:#2a3942;

color:white;

padding:9px 14px;

border-radius:8px;

cursor:pointer;

}

.mainContent{

height:calc(100vh - 65px);

display:flex;

}

.usersPanel{

width:100%;

max-width:400px;

background:#111b21;

overflow-y:auto;

}

.chatsTitle{

padding:18px;

font-size:19px;

font-weight:bold;

border-bottom:1px solid #202c33;

}

.userItem{

display:flex;

align-items:center;

gap:13px;

padding:14px;

border-bottom:1px solid #202c33;

cursor:pointer;

}

.userItem:hover{

background:#202c33;

}

height:48px;

border-radius:50%;

background:#25d366;

color:#071b12;

align-items:center;

justify-content:center;

font-size:20px;

font-weight:bold;

}

.userInfo{

min-width:0;

}

.userName{

font-weight:bold;

font-size:15px;

}

.userStatus{

color:#8696a0;

font-size:12px;

margin-top:4px;

}

/* ================= CHAT ================= */

.chatPanel{

flex:1;

display:none;

flex-direction:column;

background:#0b141a;

}

.chatHeader{

height:65px;

background:#202c33;

display:flex;

align-items:center;

gap:10px;

padding:0 12px;

}

.backButton{

border:none;

background:transparent;

color:white;

font-size:28px;

cursor:pointer;

}

.chatUserName{

font-weight:bold;

}

.chatStatus{

color:#8696a0;

font-size:12px;

margin-top:3px;

}

.callButton{

margin-left:auto;

border:none;

background:#25d366;

color:#071b12;

width:42px;

height:42px;

border-radius:50%;

font-size:20px;

cursor:pointer;

}

.chatMessages{

flex:1;

overflow-y:auto;

padding:15px;

display:flex;

flex-direction:column;

gap:7px;

}

.emptyChat{

margin:auto;

text-align:center;

color:#8696a0;

}

.message{

max-width:78%;

padding:9px 12px;

border-radius:9px;

font-size:15px;

line-height:1.4;

word-break:break-word;

}

.sent{

align-self:flex-end;

background:#005c4b;

}

.received{

align-self:flex-start;

background:#202c33;

}

.messageTime{

display:block;

text-align:right;

color:#aebac1;

font-size:10px;

margin-top:4px;

}

.messageBox{

min-height:65px;

padding:10px;

background:#202c33;

display:flex;

align-items:center;

gap:8px;

}

.messageInput{

flex:1;

border:none;

outline:none;

background:#2a3942;

color:white;

padding:13px 16px;

border-radius:25px;

}

.sendButton{

width:45px;

height:45px;

border:none;

border-radius:50%;

background:#25d366;

cursor:pointer;

font-size:18px;

}

/* ================= VIDEO CALL ================= */

#callScreen{

display:none;

position:fixed;

inset:0;

z-index:1000;

background:#000;

}

.remoteVideo{

width:100%;

height:100%;

object-fit:cover;

background:#111;

}

.localVideo{

position:absolute;

right:15px;

top:15px;

width:130px;

height:180px;

object-fit:cover;

background:#222;

border-radius:12px;

border:2px solid white;

z-index:5;

}

.callInfo{

position:absolute;

top:15px;

left:15px;

z-index:10;

background:rgba(0,0,0,.5);

padding:10px 15px;

border-radius:10px;

}

.callName{

font-size:18px;

font-weight:bold;

}

.callStatus{

font-size:13px;

color:#ccc;

margin-top:4px;

}

.callControls{

position:absolute;

bottom:30px;

left:0;

right:0;

display:flex;

justify-content:center;

gap:15px;

z-index:10;

}

.callControl{

width:55px;

height:55px;

border:none;

border-radius:50%;

background:#333;

color:white;

font-size:20px;

cursor:pointer;

}

.endCall{

background:#e53935;

}

.callControl.active{

background:#25d366;

color:#071b12;

}

/* ================= INCOMING ================= */

#incomingCall{

display:none;

position:fixed;

inset:0;

z-index:2000;

background:
rgba(0,0,0,.94);

align-items:center;

justify-content:center;

text-align:center;

}

.incomingBox{

padding:30px;

}

.incomingAvatar{

width:100px;

height:100px;

border-radius:50%;

background:#25d366;

color:#071b12;

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

font-weight:bold;

margin:0 auto 20px;

}

.incomingName{

font-size:25px;

font-weight:bold;

margin-bottom:10px;

}

.incomingText{

color:#aaa;

margin-bottom:30px;

}

.incomingButtons{

display:flex;

justify-content:center;

gap:25px;

}

.acceptButton,
.rejectButton{

width:65px;

height:65px;

border:none;

border-radius:50%;

color:white;

font-size:25px;

cursor:pointer;

}

.acceptButton{

background:#25d366;

}

.rejectButton{

background:#e53935;

}

/* ================= MOBILE ================= */

@media(max-width:700px){

.usersPanel{

max-width:none;

}

.chatPanel{

position:fixed;

inset:0;

z-index:50;

}

.localVideo{

width:110px;

height:150px;

}

}

<script type="module">


/* =================================================
FIREBASE IMPORTS
================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
set,
push,
get,
remove,
onValue,
onDisconnect
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =================================================
FIREBASE CONFIG
================================================= */

const firebaseConfig = {

apiKey:
"AIzaSyCrytf77WuZJthewnFLy5XL6i5Xh0vAW7o",

authDomain:
"great-assistance.firebaseapp.com",

databaseURL:
"https://great-assistance-default-rtdb.europe-west1.firebasedatabase.app",

projectId:
"great-assistance",

storageBucket:
"great-assistance.firebasestorage.app",

messagingSenderId:
"673899916289",

appId:
"1:673899916289:web:4c1f2b0845342309f62400"

};


/* =================================================
INITIALIZE
================================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);


/* =================================================
VARIABLES
================================================= */

let currentUser = null;

let selectedUser = null;

let stopUsersListener = null;

let stopMessagesListener = null;

let stopIncomingCalls = null;

let currentCallId = null;

let currentCall = null;

let localStream = null;

let remoteStream = null;

let isCaller = false;


/* =================================================
WEBRTC CONFIG
================================================= */

const rtcConfiguration = {

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls:
"stun:stun1.l.google.com:19302"
}

]

};


/* =================================================
ELEMENTS
================================================= */

const authScreen =
document.getElementById("authScreen");

const appScreen =
document.getElementById("appScreen");

const loginForm =
document.getElementById("loginForm");

const registerForm =
document.getElementById("registerForm");

const authMessage =
document.getElementById("authMessage");

const usersList =
document.getElementById("usersList");

const chatPanel =
document.getElementById("chatPanel");

const chatMessages =
document.getElementById("chatMessages");

const messageInput =
document.getElementById("messageInput");

const callScreen =
document.getElementById("callScreen");

const incomingCall =
document.getElementById("incomingCall");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");


/* =================================================
AUTH MESSAGE
================================================= */

function showMessage(message){

authMessage.textContent =
message;

}


/* =================================================
REGISTER SCREEN
================================================= */

document
.getElementById("showRegisterButton")
.addEventListener(
"click",
function(){

loginForm.style.display =
"none";

registerForm.style.display =
"block";

document.getElementById(
"authSubtitle"
).textContent =
"Create your account";

showMessage("");

});


document
.getElementById("showLoginButton")
.addEventListener(
"click",
function(){

registerForm.style.display =
"none";

loginForm.style.display =
"block";

document.getElementById(
"authSubtitle"
).textContent =
"Secure messaging";

showMessage("");

});


/* =================================================
LOGIN
================================================= */

document
.getElementById("loginButton")
.addEventListener(
"click",
async function(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

if(!email || !password){

showMessage(
"Please enter your email and password."
);

return;

}

showMessage(
"Signing in..."
);

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

catch(error){

console.error(error);

showMessage(
friendlyError(error)
);

}

});


/* =================================================
CREATE ACCOUNT
================================================= */

document
.getElementById("createAccountButton")
.addEventListener(
"click",
async function(){

const name =
document
.getElementById("registerName")
.value
.trim();

const email =
document
.getElementById("registerEmail")
.value
.trim();

const password =
document
.getElementById("registerPassword")
.value;

if(!name){

showMessage(
"Please enter your name."
);

return;

}

if(!email){

showMessage(
"Please enter your email."
);

return;

}

if(password.length < 6){

showMessage(
"Password must contain at least 6 characters."
);

return;

}

showMessage(
"Creating account..."
);

try{

const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const user =
result.user;

await set(
ref(
database,
"users/" +
user.uid
),
{

name:name,

email:user.email,

online:true,

createdAt:
Date.now()

}
);

showMessage(
"Account created successfully."
);

}

catch(error){

console.error(error);

showMessage(
friendlyError(error)
);

}

});


/* =================================================
AUTH STATE
================================================= */

onAuthStateChanged(
auth,
async function(user){

if(user){

currentUser =
user;

authScreen.style.display =
"none";

appScreen.style.display =
"block";


try{

await set(
ref(
database,
"users/" +
user.uid +
"/online"
),
true
);

onDisconnect(
ref(
database,
"users/" +
user.uid +
"/online"
)
)
.set(false);

loadUsers();

listenForIncomingCalls();

}

catch(error){

console.error(error);

}

}

else{

currentUser =
null;

authScreen.style.display =
"flex";

appScreen.style.display =
"none";

}

});


/* =================================================
LOGOUT
================================================= */

document
.getElementById("logoutButton")
.addEventListener(
"click",
async function(){

try{

await endCurrentCall();

if(currentUser){

await set(
ref(
database,
"users/" +
currentUser.uid +
"/online"
),
false
);

}

if(stopUsersListener){

stopUsersListener();

stopUsersListener =
null;

}

if(stopMessagesListener){

stopMessagesListener();

stopMessagesListener =
null;

}

if(stopIncomingCalls){

stopIncomingCalls();

stopIncomingCalls =
null;

}

await signOut(auth);

}

catch(error){

console.error(error);

}

});


/* =================================================
LOAD USERS
================================================= */

function loadUsers(){

const usersRef =
ref(
database,
"users"
);

if(stopUsersListener){

stopUsersListener();

}

stopUsersListener =
onValue(

usersRef,

function(snapshot){

usersList.innerHTML =
"";

const users =
snapshot.val() || {};

let count =
0;

Object.entries(users)
.forEach(
function([uid,user]){

if(
!currentUser ||
uid === currentUser.uid
){

return;

}

count++;

const item =
document.createElement(
"div"
);

item.className =
"userItem";

const name =
user.name ||
"User";

const initial =
name
.charAt(0)
.toUpperCase();

item.innerHTML = `

<div class="avatar">
${escapeHTML(initial)}
</div>

<div class="userInfo">

<div class="userName">
${escapeHTML(name)}
</div>

<div class="userStatus">
${
user.online
? "online"
: "offline"
}
</div>

</div>

`;

item.addEventListener(
"click",
function(){

openChat(
uid,
user
);

}
);

usersList.appendChild(
item
);

});


if(count === 0){

usersList.innerHTML = `

<div style="
padding:30px;
text-align:center;
color:#8696a0;
">

No other users found.

<br><br>

Create another account
to test.

</div>

`;

}

},

function(error){

console.error(
"Users error:",
error
);

}

);

}


/* =================================================
OPEN CHAT
================================================= */

function openChat(
uid,
user
){

selectedUser = {

uid:uid,

name:
user.name ||
"User",

online:
user.online ||
false

};

chatPanel.style.display =
"flex";

document
.getElementById("chatUserName")
.textContent =
selectedUser.name;

document
.getElementById("chatAvatar")
.textContent =
selectedUser.name
.charAt(0)
.toUpperCase();

document
.getElementById("chatStatus")
.textContent =
selectedUser.online
? "online"
: "offline";

loadMessages();

}


/* =================================================
CHAT ID
================================================= */

function getChatID(){

const ids = [

currentUser.uid,

selectedUser.uid

];

ids.sort();

return ids.join("_");

}


/* =================================================
LOAD MESSAGES
================================================= */

function loadMessages(){

if(
!currentUser ||
!selectedUser
){

return;

}

if(stopMessagesListener){

stopMessagesListener();

}

const messagesRef =
ref(
database,
"messages/" +
getChatID()
);

stopMessagesListener =
onValue(

messagesRef,

function(snapshot){

chatMessages.innerHTML =
"";

const data =
snapshot.val() || {};

const messages =
Object.values(data)
.sort(
function(a,b){

return(
(a.timestamp || 0) -
(b.timestamp || 0)
);

}
);

if(messages.length === 0){

chatMessages.innerHTML = `

<div class="emptyChat">

No messages yet.<br>
Say hello! 👋

</div>

`;

return;

}

messages.forEach(
function(message){

const div =
document.createElement(
"div"
);

const sent =
message.sender ===
currentUser.uid;

div.className =
"message " +
(
sent
? "sent"
: "received"
);

const time =
new Date(
message.timestamp ||
Date.now()
)
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

div.innerHTML = `

${escapeHTML(
message.text || ""
)}

<span class="messageTime">
${time}
</span>

`;

chatMessages.appendChild(
div
);

});

chatMessages.scrollTop =
chatMessages.scrollHeight;

},

function(error){

console.error(
"Message error:",
error
);

}

);

}


/* =================================================
SEND MESSAGE
================================================= */

async function sendMessage(){

if(
!currentUser ||
!selectedUser
){

return;

}

const text =
messageInput.value.trim();

if(!text){

return;

}

try{

const messageRef =
push(
ref(
database,
"messages/" +
getChatID()
)
);

await set(
messageRef,
{

sender:
currentUser.uid,

receiver:
selectedUser.uid,

text:text,

timestamp:
Date.now()

}
);

messageInput.value =
"";

messageInput.focus();

}

catch(error){

console.error(error);

}

}


document
.getElementById("sendButton")
.addEventListener(
"click",
sendMessage
);


messageInput
.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

});


/* =================================================
BACK
================================================= */

document
.getElementById("backButton")
.addEventListener(
"click",
function(){

chatPanel.style.display =
"none";

selectedUser =
null;

if(stopMessagesListener){

stopMessagesListener();

stopMessagesListener =
null;

}

});


/* =================================================
START VIDEO CALL
================================================= */

document
.getElementById("videoCallButton")
.addEventListener(
"click",
startVideoCall
);


async function startVideoCall(){

if(
!currentUser ||
!selectedUser
){

return;

}

try{

/* GET CAMERA */

localStream =
await navigator.mediaDevices.getUserMedia({

video:true,

audio:true

});


localVideo.srcObject =
localStream;


/* CREATE PEER */

currentCall =
new RTCPeerConnection(
rtcConfiguration
);


/* ADD LOCAL TRACKS */

localStream
.getTracks()
.forEach(
function(track){

currentCall.addTrack(
track,
localStream
);

});


/* RECEIVE REMOTE */

currentCall.ontrack =
function(event){

remoteVideo.srcObject =
event.streams[0];

};


/* ICE */

const callRef =
push(
ref(database,"calls")
);

currentCallId =
callRef.key;

isCaller =
true;


/* SEND ICE */

currentCall.onicecandidate =
async function(event){

if(
event.candidate
){

await set(
ref(
database,
"calls/" +
currentCallId +
"/callerCandidates/" +
btoa(
JSON.stringify(
event.candidate.toJSON()
)
)
),
true
);

}

};


/* OFFER */

const offer =
await currentCall.createOffer();

await currentCall.setLocalDescription(
offer
);


/* SAVE CALL */

await set(
callRef,
{

caller:
currentUser.uid,

callee:
selectedUser.uid,

callerName:
getCurrentUserName(),

status:
"ringing",

offer:{
type:offer.type,
sdp:offer.sdp
},

createdAt:
Date.now()

}
);


/* SHOW SCREEN */

callScreen.style.display =
"block";

document
.getElementById("callName")
.textContent =
selectedUser.name;

document
.getElementById("callStatusText")
.textContent =
"Calling...";

watchAnswer();

}

catch(error){

console.error(error);

alert(
"Camera/microphone could not be opened.\n\n" +
error.message
);

cleanupCall();

}

}


/* =================================================
WATCH ANSWER
================================================= */

function watchAnswer(){

if(!currentCallId){

return;

}

onValue(
ref(
database,
"calls/" +
currentCallId
),
async function(snapshot){

const call =
snapshot.val();

if(!call){

return;

}

if(
call.answer &&
currentCall &&
!currentCall.currentRemoteDescription
){

try{

await currentCall.setRemoteDescription(
new RTCSessionDescription(
call.answer
)
);

document
.getElementById("callStatusText")
.textContent =
"Connected";

listenForCalleeCandidates();

}

catch(error){

console.error(error);

}

}

});

}


/* =================================================
INCOMING CALLS
================================================= */

function listenForIncomingCalls(){

const callsRef =
ref(database,"calls");

stopIncomingCalls =
onValue(
callsRef,
function(snapshot){

const calls =
snapshot.val() || {};

Object.entries(calls)
.forEach(
function([callId,call]){

if(
call.callee ===
currentUser.uid &&

call.status ===
"ringing"
){

showIncomingCall(
callId,
call
);

}

});

});

}


/* =================================================
SHOW INCOMING
================================================= */

function showIncomingCall(
callId,
call
){

if(currentCallId){

return;

}

currentCallId =
callId;

document
.getElementById("incomingName")
.textContent =
call.callerName ||
"Incoming call";

document
.getElementById("incomingAvatar")
.textContent =
(
call.callerName ||
"?"
)
.charAt(0)
.toUpperCase();

incomingCall.style.display =
"flex";

}


/* =================================================
ACCEPT CALL
================================================= */

document
.getElementById("acceptButton")
.addEventListener(
"click",
acceptCall
);


async function acceptCall(){

if(!currentCallId){

return;

}

try{

incomingCall.style.display =
"none";


const snapshot =
await get(
ref(
database,
"calls/" +
currentCallId
)
);

const call =
snapshot.val();

if(!call){

return;

}


localStream =
await navigator.mediaDevices.getUserMedia({

video:true,

audio:true

});


localVideo.srcObject =
localStream;


currentCall =
new RTCPeerConnection(
rtcConfiguration
);


localStream
.getTracks()
.forEach(
function(track){

currentCall.addTrack(
track,
localStream
);

});


currentCall.ontrack =
function(event){

remoteVideo.srcObject =
event.streams[0];

};


currentCall.onicecandidate =
async function(event){

if(
event.candidate
){

await set(
ref(
database,
"calls/" +
currentCallId +
"/calleeCandidates/" +
btoa(
JSON.stringify(
event.candidate.toJSON()
)
)
),
true
);

}

};


await currentCall.setRemoteDescription(
new RTCSessionDescription(
call.offer
)
);


const answer =
await currentCall.createAnswer();


await currentCall.setLocalDescription(
answer
);


await set(
ref(
database,
"calls/" +
currentCallId +
"/answer"
),
{

type:
answer.type,

sdp:
answer.sdp

}
);


await set(
ref(
database,
"calls/" +
currentCallId +
"/status"
),
"accepted"
);


callScreen.style.display =
"block";

document
.getElementById("callName")
.textContent =
call.callerName ||
"User";

document
.getElementById("callStatusText")
.textContent =
"Connected";


listenForCallerCandidates();

}

catch(error){

console.error(error);

alert(
"Could not accept the call.\n\n" +
error.message
);

await endCurrentCall();

}

}


/* =================================================
REJECT CALL
================================================= */

document
.getElementById("rejectButton")
.addEventListener(
"click",
async function(){

incomingCall.style.display =
"none";

if(currentCallId){

await remove(
ref(
database,
"calls/" +
currentCallId
)
);

}

currentCallId =
null;

});


/* =================================================
CALLER ICE
================================================= */

function listenForCalleeCandidates(){

if(!currentCall){

return;

}

onValue(
ref(
database,
"calls/" +
currentCallId +
"/calleeCandidates"
),
async function(snapshot){

const data =
snapshot.val() || {};

for(
const key in data
){

try{

const candidate =
JSON.parse(
atob(key)
);

await currentCall.addIceCandidate(
new RTCIceCandidate(
candidate
)
);

}
catch(error){

console.error(error);

}

}

});

}


/* =================================================
CALLEE ICE
================================================= */

function listenForCallerCandidates(){

if(!currentCall){

return;

}

onValue(
ref(
database,
"calls/" +
currentCallId +
"/callerCandidates"
),
async function(snapshot){

const data =
snapshot.val() || {};

for(
const key in data
){

try{

const candidate =
JSON.parse(
atob(key)
);

await currentCall.addIceCandidate(
new RTCIceCandidate(
candidate
)
);

}
catch(error){

console.error(error);

}

}

});

}


/* =================================================
END CALL
================================================= */

document
.getElementById("endCallButton")
.addEventListener(
"click",
endCurrentCall
);


async function endCurrentCall(){

if(
currentCallId
){

try{

await remove(
ref(
database,
"calls/" +
currentCallId
)
);

}
catch(error){

console.error(error);

}

}


if(currentCall){

currentCall.close();

currentCall =
null;

}


if(localStream){

localStream
.getTracks()
.forEach(
function(track){

track.stop();

});

localStream =
null;

}


remoteVideo.srcObject =
null;

localVideo.srcObject =
null;

currentCallId =
null;

isCaller =
false;

callScreen.style.display =
"none";

incomingCall.style.display =
"none";

}


/* =================================================
MUTE
================================================= */

document
.getElementById("muteButton")
.addEventListener(
"click",
function(){

if(!localStream){

return;

}

const audioTrack =
localStream
.getAudioTracks()[0];

if(!audioTrack){

return;

}

audioTrack.enabled =
!audioTrack.enabled;

this.textContent =
audioTrack.enabled
? "🎤"
: "🔇";

});


/* =================================================
CAMERA
================================================= */

document
.getElementById("cameraButton")
.addEventListener(
"click",
function(){

if(!localStream){

return;

}

const videoTrack =
localStream
.getVideoTracks()[0];

if(!videoTrack){

return;

}

videoTrack.enabled =
!videoTrack.enabled;

this.textContent =
videoTrack.enabled
? "📷"
: "🚫";

});


/* =================================================
CURRENT USER NAME
================================================= */

function getCurrentUserName(){

return currentUser.email ||
"Great Assistance User";

}


/* =================================================
ERRORS
================================================= */

function friendlyError(error){

switch(error.code){

case "auth/invalid-credential":

return "Incorrect email or password.";

case "auth/email-already-in-use":

return "This email is already registered.";

case "auth/invalid-email":

return "Please enter a valid email.";

case "auth/weak-password":

return "Password must contain at least 6 characters.";

case "auth/network-request-failed":

return "Network connection problem.";

default:

return error.message ||
"Something went wrong.";

}

}


/* =================================================
ESCAPE HTML
================================================= */

function escapeHTML(value){

const div =
document.createElement("div");

div.textContent =
String(value);

return div.innerHTML;

}
