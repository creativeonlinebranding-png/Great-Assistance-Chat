<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Great Assistance Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111b21;
    color: white;
    height: 100vh;
}

button,
input {
    font-family: inherit;
}

#authScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(
        135deg,
        #111b21,
        #1c3138
    );
}

.authBox {
    width: 100%;
    max-width: 400px;
    background: #202c33;
    padding: 30px 25px;
    border-radius: 18px;
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #25d366;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #8696a0;
    margin-bottom: 25px;
}

.authInput {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    border: none;
    outline: none;
    border-radius: 10px;
    background: #2a3942;
    color: white;
    font-size: 15px;
}

.mainButton {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #25d366;
    color: #071b12;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.secondaryButton {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: none;
    background: transparent;
    color: #25d366;
    cursor: pointer;
}

.authMessage {
    text-align: center;
    margin-top: 15px;
    color: #ff7777;
    font-size: 13px;
}

#registerForm {
    display: none;
}

#appScreen {
    display: none;
    height: 100vh;
}

.topHeader {
    height: 65px;
    background: #202c33;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
}

.appTitle {
    font-size: 21px;
    font-weight: bold;
}

.appTitle span {
    color: #25d366;
}

.logoutButton {
    border: none;
    background: #2a3942;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
}

.mainContent {
    height: calc(100vh - 65px);
    display: flex;
}

.usersPanel {
    width: 100%;
    max-width: 400px;
    overflow-y: auto;
    background: #111b21;
}

.chatsTitle {
    padding: 18px;
    font-size: 19px;
    font-weight: bold;
    border-bottom: 1px solid #202c33;
}

.userItem {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px;
    border-bottom: 1px solid #202c33;
    cursor: pointer;
}

.userItem:hover {
    background: #202c33;
}

.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #25d366;
    color: #071b12;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
}

.userInfo {
    min-width: 0;
}

.userName {
    font-weight: bold;
}

.userStatus {
    color: #8696a0;
    font-size: 12px;
    margin-top: 4px;
}

.chatPanel {
    flex: 1;
    display: none;
    flex-direction: column;
    background: #0b141a;
}

.chatHeader {
    height: 65px;
    background: #202c33;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
}

.backButton {
    border: none;
    background: transparent;
    color: white;
    font-size: 28px;
}

.chatUserName {
    font-weight: bold;
}

.chatStatus {
    color: #8696a0;
    font-size: 12px;
    margin-top: 3px;
}

.callButton {
    margin-left: auto;
    border: none;
    background: #25d366;
    color: #071b12;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

.chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.emptyChat {
    margin: auto;
    text-align: center;
    color: #8696a0;
}

.message {
    max-width: 78%;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
}

.sent {
    align-self: flex-end;
    background: #005c4b;
}

.received {
    align-self: flex-start;
    background: #202c33;
}

.messageTime {
    display: block;
    text-align: right;
    color: #aebac1;
    font-size: 10px;
    margin-top: 4px;
}

.messageBox {
    min-height: 65px;
    padding: 10px;
    background: #202c33;
    display: flex;
    gap: 8px;
    align-items: center;
}

.messageInput {
    flex: 1;
    border: none;
    outline: none;
    background: #2a3942;
    color: white;
    padding: 13px 16px;
    border-radius: 25px;
}

.sendButton {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #25d366;
    font-size: 18px;
}

/* INCOMING CALL */

#incomingCall {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    background: rgba(
        0,
        0,
        0,
        0.85
    );

    justify-content: center;

    align-items: center;

}

.incomingBox {

    width: 90%;

    max-width: 380px;

    background: #202c33;

    border-radius: 20px;

    padding: 30px;

    text-align: center;

}

.incomingAvatar {

    width: 80px;

    height: 80px;

    margin: auto;

    border-radius: 50%;

    background: #25d366;

    color: #071b12;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 35px;

    font-weight: bold;

}

.incomingTitle {

    font-size: 23px;

    font-weight: bold;

    margin-top: 20px;

}

.incomingText {

    color: #8696a0;

    margin: 10px 0 25px;

}

.incomingButtons {

    display: flex;

    gap: 12px;

}

.answerButton,
.rejectButton {

    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 10px;

    color: white;

    font-weight: bold;

    cursor: pointer;

}

.answerButton {

    background: #25d366;

    color: #071b12;

}

.rejectButton {

    background: #e53935;

}

@media (max-width: 700px) {

    .usersPanel {
        max-width: none;
    }

    .chatPanel {
        position: fixed;
        inset: 0;
        z-index: 50;
    }

}

</style>

</head>

<body>


<!-- AUTH -->

<div id="authScreen">

    <div class="authBox">

        <div class="logo">
            Great Assistance
        </div>

        <div
            class="subtitle"
            id="authSubtitle">

            Secure messaging

        </div>


        <div id="loginForm">

            <input
                id="loginEmail"
                class="authInput"
                type="email"
                placeholder="Email address">

            <input
                id="loginPassword"
                class="authInput"
                type="password"
                placeholder="Password">

            <button
                id="loginButton"
                class="mainButton">

                Login

            </button>

            <button
                id="showRegisterButton"
                class="secondaryButton">

                Create new account

            </button>

        </div>


        <div id="registerForm">

            <input
                id="registerName"
                class="authInput"
                type="text"
                placeholder="Your name">

            <input
                id="registerEmail"
                class="authInput"
                type="email"
                placeholder="Email address">

            <input
                id="registerPassword"
                class="authInput"
                type="password"
                placeholder="Password">

            <button
                id="createAccountButton"
                class="mainButton">

                Create Account

            </button>

            <button
                id="showLoginButton"
                class="secondaryButton">

                Back to Login

            </button>

        </div>

        <div
            id="authMessage"
            class="authMessage">
        </div>

    </div>

</div>


<!-- MAIN APP -->

<div id="appScreen">

    <div class="topHeader">

        <div class="appTitle">
            Great <span>Assistance</span>
        </div>

        <button
            id="logoutButton"
            class="logoutButton">

            Logout

        </button>

    </div>


    <div class="mainContent">


        <div
            id="usersPanel"
            class="usersPanel">

            <div class="chatsTitle">
                Chats
            </div>

            <div id="usersList">

                <div style="
                    padding:30px;
                    text-align:center;
                    color:#8696a0">

                    Loading users...

                </div>

            </div>

        </div>


        <div
            id="chatPanel"
            class="chatPanel">

            <div class="chatHeader">

                <button
                    id="backButton"
                    class="backButton">

                    ‹

                </button>

                <div
                    id="chatAvatar"
                    class="avatar">

                    ?

                </div>

                <div>

                    <div
                        id="chatUserName"
                        class="chatUserName">

                        User

                    </div>

                    <div
                        id="chatStatus"
                        class="chatStatus">

                        offline

                    </div>

                </div>


                <button
                    id="videoCallButton"
                    class="callButton"
                    title="Video Call">

                    📹

                </button>

            </div>


            <div
                id="chatMessages"
                class="chatMessages">
            </div>


            <div class="messageBox">

                <input
                    id="messageInput"
                    class="messageInput"
                    type="text"
                    placeholder="Type a message...">

                <button
                    id="sendButton"
                    class="sendButton">

                    ➤

                </button>

            </div>

        </div>

    </div>

</div>


<!-- INCOMING CALL -->

<div id="incomingCall">

    <div class="incomingBox">

        <div
            id="incomingAvatar"
            class="incomingAvatar">

            ?

        </div>

        <div
            id="incomingCaller"
            class="incomingTitle">

            Incoming Video Call

        </div>

        <div class="incomingText">

            is calling you

        </div>

        <div class="incomingButtons">

            <button
                id="rejectCallButton"
                class="rejectButton">

                Decline

            </button>

            <button
                id="answerCallButton"
                class="answerButton">

                Answer

            </button>

        </div>

    </div>

</div>


<script type="module">


/* FIREBASE */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    onDisconnect,
    update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyCrytf77WuZJthewnFLy5XL6i5Xh0vAW7o",

    authDomain:
    "great-assistance.firebaseapp.com",

    databaseURL:
    "https://great-assistance-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "great-assistance",

    storageBucket:
    "great-assistance.firebasestorage.app",

    messagingSenderId:
    "673899916289",

    appId:
    "1:673899916289:web:4c1f2b0845342309f62400"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const database =
getDatabase(app);


/* VARIABLES */

let currentUser = null;

let selectedUser = null;

let stopUsersListener = null;

let stopMessagesListener = null;

let stopIncomingCallsListener = null;

let incomingCallData = null;


/* ELEMENTS */

const authScreen =
document.getElementById(
    "authScreen"
);

const appScreen =
document.getElementById(
    "appScreen"
);

const authMessage =
document.getElementById(
    "authMessage"
);

const loginForm =
document.getElementById(
    "loginForm"
);

const registerForm =
document.getElementById(
    "registerForm"
);

const usersList =
document.getElementById(
    "usersList"
);

const chatPanel =
document.getElementById(
    "chatPanel"
);

const chatMessages =
document.getElementById(
    "chatMessages"
);

const messageInput =
document.getElementById(
    "messageInput"
);


/* MESSAGE */

function showMessage(text) {

    authMessage.textContent =
    text;

}


/* REGISTER */

document
.getElementById(
    "showRegisterButton"
)
.onclick = () => {

    loginForm.style.display =
    "none";

    registerForm.style.display =
    "block";

    document.getElementById(
        "authSubtitle"
    ).textContent =
    "Create your account";

    showMessage("");

};


/* LOGIN FORM */

document
.getElementById(
    "showLoginButton"
)
.onclick = () => {

    registerForm.style.display =
    "none";

    loginForm.style.display =
    "block";

    document.getElementById(
        "authSubtitle"
    ).textContent =
    "Secure messaging";

    showMessage("");

};


/* LOGIN */

document
.getElementById(
    "loginButton"
)
.onclick = async () => {

    const email =
    document.getElementById(
        "loginEmail"
    ).value.trim();

    const password =
    document.getElementById(
        "loginPassword"
    ).value;


    if (!email || !password) {

        showMessage(
            "Please enter your email and password."
        );

        return;

    }


    showMessage(
        "Signing in..."
    );


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message
        );

    }

};


/* CREATE ACCOUNT */

document
.getElementById(
    "createAccountButton"
)
.onclick = async () => {

    const name =
    document.getElementById(
        "registerName"
    ).value.trim();

    const email =
    document.getElementById(
        "registerEmail"
    ).value.trim();

    const password =
    document.getElementById(
        "registerPassword"
    ).value;


    if (!name) {

        showMessage(
            "Please enter your name."
        );

        return;

    }


    if (!email) {

        showMessage(
            "Please enter your email."
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;

    }


    showMessage(
        "Creating account..."
    );


    try {

        const result =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        await set(

            ref(
                database,
                "users/" +
                result.user.uid
            ),

            {

                name:
                name,

                email:
                result.user.email,

                online:
                true,

                createdAt:
                Date.now()

            }

        );

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message
        );

    }

};


/* AUTH STATE */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            currentUser =
            null;

            authScreen.style.display =
            "flex";

            appScreen.style.display =
            "none";

            return;

        }


        currentUser =
        user;


        authScreen.style.display =
        "none";

        appScreen.style.display =
        "block";


        await set(

            ref(
                database,
                "users/" +
                user.uid +
                "/online"
            ),

            true

        );


        onDisconnect(

            ref(
                database,
                "users/" +
                user.uid +
                "/online"
            )

        ).set(false);


        loadUsers();

        listenForIncomingCalls();

    }
);


/* LOGOUT */

document
.getElementById(
    "logoutButton"
)
.onclick = async () => {

    try {

        if (currentUser) {

            await set(

                ref(
                    database,
                    "users/" +
                    currentUser.uid +
                    "/online"
                ),

                false

            );

        }


        await signOut(auth);

    }

    catch(error) {

        console.error(error);

    }

};


/* USERS */

function loadUsers() {

    const usersRef =
    ref(
        database,
        "users"
    );


    if (stopUsersListener) {

        stopUsersListener();

    }


    stopUsersListener =
    onValue(

        usersRef,

        snapshot => {

            usersList.innerHTML =
            "";

            const users =
            snapshot.val() || {};

            let found =
            false;


            Object.entries(users)
            .forEach(
                ([uid, user]) => {

                    if (
                        !currentUser ||
                        uid === currentUser.uid
                    ) {

                        return;

                    }


                    found =
                    true;


                    const item =
                    document.createElement(
                        "div"
                    );

                    item.className =
                    "userItem";


                    const name =
                    user.name ||
                    "User";


                    item.innerHTML = `

                        <div class="avatar">

                            ${escapeHTML(
                                name
                                .charAt(0)
                                .toUpperCase()
                            )}

                        </div>

                        <div class="userInfo">

                            <div class="userName">

                                ${escapeHTML(name)}

                            </div>

                            <div class="userStatus">

                                ${
                                    user.online
                                    ? "online"
                                    : "offline"
                                }

                            </div>

                        </div>

                    `;


                    item.onclick =
                    () => {

                        openChat(
                            uid,
                            user
                        );

                    };


                    usersList.appendChild(
                        item
                    );

                }
            );


            if (!found) {

                usersList.innerHTML = `

                    <div style="
                        padding:30px;
                        text-align:center;
                        color:#8696a0">

                        No other users found.

                    </div>

                `;

            }

        }

    );

}


/* OPEN CHAT */

function openChat(uid, user) {

    selectedUser = {

        uid:
        uid,

        name:
        user.name ||
        "User"

    };


    chatPanel.style.display =
    "flex";


    document.getElementById(
        "chatUserName"
    ).textContent =
    selectedUser.name;


    document.getElementById(
        "chatAvatar"
    ).textContent =
    selectedUser.name
    .charAt(0)
    .toUpperCase();


    updateSelectedUserStatus(
        uid
    );


    loadMessages();

}


/* LIVE SELECTED USER STATUS */

function updateSelectedUserStatus(uid) {

    onValue(

        ref(
            database,
            "users/" +
            uid +
            "/online"
        ),

        snapshot => {

            document.getElementById(
                "chatStatus"
            ).textContent =
            snapshot.val()
            ? "online"
            : "offline";

        }

    );

}


/* CHAT ID */

function chatID() {

    return [

        currentUser.uid,

        selectedUser.uid

    ]
    .sort()
    .join("_");

}


/* MESSAGES */

function loadMessages() {

    if (stopMessagesListener) {

        stopMessagesListener();

    }


    stopMessagesListener =
    onValue(

        ref(
            database,
            "messages/" +
            chatID()
        ),

        snapshot => {

            chatMessages.innerHTML =
            "";

            const messages =
            Object.values(
                snapshot.val() || {}
            )
            .sort(
                (a,b) =>
                (a.timestamp || 0) -
                (b.timestamp || 0)
            );


            if (!messages.length) {

                chatMessages.innerHTML = `

                    <div class="emptyChat">

                        No messages yet.<br>
                        Say hello! 👋

                    </div>

                `;

                return;

            }


            messages.forEach(
                message => {

                    const div =
                    document.createElement(
                        "div"
                    );


                    const sent =
                    message.sender ===
                    currentUser.uid;


                    div.className =
                    "message " +
                    (
                        sent
                        ? "sent"
                        : "received"
                    );


                    const time =
                    new Date(
                        message.timestamp ||
                        Date.now()
                    )
                    .toLocaleTimeString(
                        [],
                        {
                            hour:
                            "2-digit",

                            minute:
                            "2-digit"
                        }
                    );


                    div.innerHTML = `

                        ${escapeHTML(
                            message.text || ""
                        )}

                        <span class="messageTime">

                            ${time}

                        </span>

                    `;


                    chatMessages.appendChild(
                        div
                    );

                }
            );


            chatMessages.scrollTop =
            chatMessages.scrollHeight;

        }

    );

}


/* SEND */

async function sendMessage() {

    if (!selectedUser) {

        return;

    }


    const text =
    messageInput.value.trim();


    if (!text) {

        return;

    }


    await set(

        push(

            ref(
                database,
                "messages/" +
                chatID()
            )

        ),

        {

            sender:
            currentUser.uid,

            receiver:
            selectedUser.uid,

            text:
            text,

            timestamp:
            Date.now()

        }

    );


    messageInput.value =
    "";

}


document
.getElementById(
    "sendButton"
)
.onclick =
sendMessage;


messageInput
.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* BACK */

document
.getElementById(
    "backButton"
)
.onclick = () => {

    chatPanel.style.display =
    "none";

    selectedUser =
    null;

};


/* ==========================================
   START VIDEO CALL
========================================== */

document
.getElementById(
    "videoCallButton"
)
.onclick = async () => {

    if (!selectedUser) {

        alert(
            "Please select a user first."
        );

        return;

    }


    try {

        const callRef =
        push(
            ref(
                database,
                "calls"
            )
        );


        const callId =
        callRef.key;


        await set(
            callRef,
            {

                caller:
                currentUser.uid,

                callee:
                selectedUser.uid,

                callerName:
                currentUser.displayName ||
                "Great Assistance User",

                status:
                "ringing",

                createdAt:
                Date.now()

            }
        );


        const videoURL =
        "https://creativeonlinebranding-png.github.io/Great-Assistance-Video-Call/"
        +
        "?call="
        +
        encodeURIComponent(
            callId
        )
        +
        "&uid="
        +
        encodeURIComponent(
            currentUser.uid
        );


        window.open(
            videoURL,
            "_blank"
        );

    }

    catch(error) {

        console.error(error);

        alert(
            "Could not start video call."
        );

    }

};


/* ==========================================
   INCOMING CALLS
========================================== */

function listenForIncomingCalls() {

    if (stopIncomingCallsListener) {

        stopIncomingCallsListener();

    }


    stopIncomingCallsListener =
    onValue(

        ref(
            database,
            "calls"
        ),

        snapshot => {

            const calls =
            snapshot.val() || {};


            let newestCall =
            null;


            Object.entries(calls)
            .forEach(
                ([callId, call]) => {

                    if (!call) {

                        return;

                    }


                    if (
                        call.callee ===
                        currentUser.uid &&
                        call.status ===
                        "ringing"
                    ) {

                        if (
                            !newestCall ||
                            (
                                call.createdAt >
                                newestCall.call.createdAt
                            )
                        ) {

                            newestCall = {

                                id:
                                callId,

                                call:
                                call

                            };

                        }

                    }

                }
            );


            if (newestCall) {

                showIncomingCall(
                    newestCall.id,
                    newestCall.call
                );

            }

            else {

                hideIncomingCall();

            }

        }

    );

}


/* SHOW INCOMING */

function showIncomingCall(
    callId,
    call
) {

    incomingCallData = {

        id:
        callId,

        call:
        call

    };


    const name =
    call.callerName ||
    "Great Assistance User";


    document.getElementById(
        "incomingCaller"
    ).textContent =
    name;


    document.getElementById(
        "incomingAvatar"
    ).textContent =
    name
    .charAt(0)
    .toUpperCase();


    document.getElementById(
        "incomingCall"
    ).style.display =
    "flex";

}


/* HIDE */

function hideIncomingCall() {

    document.getElementById(
        "incomingCall"
    ).style.display =
    "none";

}


/* ANSWER */

document
.getElementById(
    "answerCallButton"
)
.onclick = async () => {

    if (!incomingCallData) {

        return;

    }


    const callId =
    incomingCallData.id;


    await update(

        ref(
            database,
            "calls/" +
            callId
        ),

        {

            status:
            "accepted"

        }

    );


    const videoURL =
    "https://creativeonlinebranding-png.github.io/Great-Assistance-Video-Call/"
    +
    "?call="
    +
    encodeURIComponent(
        callId
    )
    +
    "&uid="
    +
    encodeURIComponent(
        currentUser.uid
    );


    hideIncomingCall();


    window.open(
        videoURL,
        "_blank"
    );

};


/* REJECT */

document
.getElementById(
    "rejectCallButton"
)
.onclick = async () => {

    if (!incomingCallData) {

        return;

    }


    await update(

        ref(
            database,
            "calls/" +
            incomingCallData.id
        ),

        {

            status:
            "rejected"

        }

    );


    hideIncomingCall();

};


/* ESCAPE */

function escapeHTML(value) {

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    String(value);

    return div.innerHTML;

}
